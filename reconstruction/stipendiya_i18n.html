<style>
:root{
  --phosphor:#e8f4ef;--phosphor-dim:#9ab8ae;--tube:#050807;
  --case:#c9c0a8;--case-dark:#a89f86;--case-shadow:#6f6752;
  --key:#3a3a3c;--key-red:#8c3b2e;--badge:#2c2c2e;

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#141210;min-height:100%}
body{font-family:"PT Mono","Courier New",ui-monospace,monospace;
  display:flex;flex-direction:column;align-items:center;padding:14px 8px 40px;color:var(--case);}
.unit{width:100%;max-width:760px}
.cabinet{background:linear-gradient(178deg,var(--case) 0%,var(--case-dark) 88%);
  border-radius:14px 14px 8px 8px;padding:18px 18px 12px;
  box-shadow:0 18px 40px #000c, inset 0 2px 0 #fff5, inset 0 -6px 12px var(--case-shadow);}
.badge-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.badge{background:var(--badge);color:#ddd;letter-spacing:.35em;font-size:13px;
  padding:4px 12px 4px 15px;border-radius:2px;box-shadow:inset 0 1px 0 #fff2,0 1px 2px #0008;}
.plate{font-size:9px;color:#5c5546;text-align:right;line-height:1.5;letter-spacing:.05em}
.langsel{display:flex;gap:0;border:1px solid #7a7260;border-radius:3px;overflow:hidden}
.langsel button{font-family:inherit;font-size:10px;letter-spacing:.15em;border:0;
  background:#b3aa91;color:#4a4438;padding:4px 10px;cursor:pointer}
.langsel button+button{border-left:1px solid #7a7260}
.langsel button.on{background:var(--badge);color:#eee}
.langsel button:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.crt-frame{background:#1b1a17;border-radius:10px;padding:10px;box-shadow:inset 0 3px 10px #000;}
.crt{position:relative;background:radial-gradient(120% 100% at 50% 40%,#0c110f 0%,var(--tube) 75%);
  border-radius:6px;overflow:hidden;aspect-ratio:4/2.55;}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0 2px,#0003 2px 3px),
  radial-gradient(115% 115% at 50% 50%,transparent 62%,#000a 100%);}
pre#screen{position:absolute;inset:0;padding:1.4% 2%;color:var(--phosphor);
  font-family:inherit;font-size:min(1.83vw,13.5px);line-height:1.28;
  text-shadow:0 0 3px #cfeee288,0 0 9px #9fd8c633;white-space:pre;overflow:hidden;}
#screen .cur{background:var(--phosphor);color:var(--tube);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{background:transparent;color:var(--phosphor)}}
@media (prefers-reduced-motion:reduce){#screen .cur{animation:none}}
.drivebar{display:flex;align-items:center;gap:10px;margin:10px 4px 2px}
.slot{flex:1;height:9px;background:#221f19;border-radius:2px;box-shadow:inset 0 2px 3px #000}
.lamp{width:9px;height:9px;border-radius:50%;background:#3a1e14;box-shadow:inset 0 1px 1px #0009;transition:background .1s}
.lamp.on{background:#ff7a3c;box-shadow:0 0 8px #ff7a3c99}
.drv-lbl{font-size:9px;color:#5c5546;letter-spacing:.15em}
.keyboard{margin-top:10px;background:linear-gradient(180deg,var(--case-dark),var(--case-shadow));
  border-radius:8px;padding:12px 12px 14px;box-shadow:0 10px 24px #0009, inset 0 1px 0 #fff3;}
.krow{display:flex;gap:6px;justify-content:center;margin-top:6px}
.krow:first-child{margin-top:0}
button.k{font-family:inherit;font-size:15px;color:#eee;background:linear-gradient(180deg,#4a4a4d,var(--key));
  border:0;border-radius:5px;min-width:44px;height:44px;padding:0 10px;
  box-shadow:0 3px 0 #1c1c1e, inset 0 1px 0 #fff3;cursor:pointer;touch-action:manipulation;}
button.k:active{transform:translateY(2px);box-shadow:0 1px 0 #1c1c1e}
button.k.wide{min-width:96px;font-size:12px;letter-spacing:.08em}
button.k.red{background:linear-gradient(180deg,#a5493a,var(--key-red))}
button.k:focus-visible{outline:2px solid #fff;outline-offset:2px}
#textentry{display:none;width:100%;margin-top:8px;font-family:inherit;font-size:16px;

.caption{max-width:760px;margin-top:16px;font-size:11px;line-height:1.7;color:#8d8471}

/* ══════════ screen ══════════ */
const COLS=80, ROWS=24;
const scr=document.getElementById('screen');
let grid, cr, cc, cursorOn=true;
function cls(){grid=Array.from({length:ROWS},()=>Array(COLS).fill(' '));cr=0;cc=0;draw();}
function draw(){
  let out='';
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const ch=grid[r][c];
      if(cursorOn&&r===cr&&c===cc){out+='<span class="cur">'+(ch===' '?'&nbsp;':esc(ch))+'</span>';}
      else out+=esc(ch);
    }
    out+='\n';
  }
  scr.innerHTML=out;
}
function esc(ch){return ch==='<'?'&lt;':ch==='&'?'&amp;':ch;}
function put(s){for(const ch of s){if(ch==='\n'){nl();continue;}grid[cr][cc]=ch;cc++;if(cc>=COLS)nl();}draw();}
function nl(){cc=0;cr++;if(cr>=ROWS){grid.shift();grid.push(Array(COLS).fill(' '));cr=ROWS-1;}}
function at(r,c){cr=Math.min(r,ROWS-1);cc=Math.min(c,COLS-1);}
function tab(n){cc=n;}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function type(s,d=18){for(const ch of s){put(ch);await sleep(d);}}
function lamp(id,on){document.getElementById(id).classList.toggle('on',on);}
async function drive(id,ms){lamp(id,true);await sleep(ms);lamp(id,false);}

/* ══════════ input ══════════ */
let keyResolver=null;
const textInput=document.getElementById('textentry');
function waitKey(){return new Promise(res=>{keyResolver=res;});}
function feed(k){
  if(k==='СБРОС'){location.reload();return;}
  if(k==='ТЕКСТ'){textInput.style.display='block';textInput.focus();return;}
  if(keyResolver){const r=keyResolver;keyResolver=null;r(k);}
}
document.querySelectorAll('button.k').forEach(b=>{
  b.addEventListener('click',()=>feed(b.dataset.key||b.textContent.trim()));
});
document.addEventListener('keydown',e=>{
  if(document.activeElement===textInput){
    if(e.key==='Enter'){e.preventDefault();const v=textInput.value;textInput.value='';
      textInput.style.display='none';feedText(v);}
    return;
  }
  if(e.key>='0'&&e.key<='9')feed(e.key);
  if(e.key==='Enter')feed('ВК');
  if(e.key==='c'||e.key==='C')feed('ПРОДОЛЖ');
});
let textResolver=null;
function waitText(){textInput.style.display='block';textInput.focus();
  return new Promise(res=>{textResolver=res;});}
function feedText(v){if(textResolver){const r=textResolver;textResolver=null;r(v);}}
async function inputNum(){
  let buf='';
  for(;;){
    const k=await waitKey();
    if(k==='ВК'){nl();return buf===''?0:parseInt(buf,10);}
    if(k==='ПРОДОЛЖ')continue;
    if(/^\d$/.test(k)){buf+=k;put(k);}
  }
}
async function waitContinue(){for(;;){const k=await waitKey();if(k==='ПРОДОЛЖ')return;}}

  document.getElementById('kbCR').textContent=L('kCR');
  document.getElementById('kbCont').textContent=L('kCont');
  document.getElementById('kbTxt').textContent=L('kTxt');
  document.getElementById('kbRst').textContent=L('kRst');
  textInput.placeholder=L('phText');
  document.getElementById('cap').textContent=L('cap');
  document.documentElement.lang=LANG;
}
function setLang(l){
  LANG=l;
  for(const id of ['lru','len'])
    document.getElementById(id).classList.toggle('on',
      (id==='lru'&&l==='ru')||(id==='len'&&l==='en'));
  applyChromeLang();
  /* redraw current menu scene in the new language; mid-dialog the new
     language simply applies from the next screen output */
  if(keyResolver){                 // only safe to redraw while idle at a prompt
    const pend=keyResolver;keyResolver=null;
    if(scene==='s0')s0(); else if(scene==='s1')s1(); else if(scene==='s2')s2();
    else keyResolver=pend;
  }
}
document.getElementById('lru').onclick=()=>setLang('ru');
document.getElementById('len').onclick=()=>setLang('en');

/* ══════════ "diskette" ══════════ */
let disk={groups:[]};
async function diskLoad(){try{const r=await window.storage.get('iskra-stipendiya');
  if(r&&r.value)disk=JSON.parse(r.value);}catch(e){}}
async function diskSave(){try{await window.storage.set('iskra-stipendiya',JSON.stringify(disk));}catch(e){}}

/* ══════════ boot ══════════ */
async function boot(){
  cls();
  await sleep(500);
  lamp('lampA',true);
  put(L('bootLoad')+'\n');
  for(let i=0;i<3;i++){await sleep(320);put('.');}
  await sleep(400);lamp('lampA',false);
  nl();nl();
  put('BASIC 02  22.04.84\n');   /* authentic banner, never translated */
  put(L('bootReady')+'\n\n');
  put(':');
  await sleep(600);
  await type('LOAD "S0"',40); nl();
  await drive('lampA',700);
  put(':');await sleep(350);
  await type('RUN',60); nl();
  await sleep(300);
  s0();
}

/* ══════════ S0 dispatcher ══════════ */
async function s0(){
  scene='s0'; cls();
  at(0,0);
  tab(9);put('------------------------------------------------------\n');
  tab(9);put(L('s0t1')+'\n');
  tab(9);put(L('s0t2')+'\n');
  tab(9);put('------------------------------------------------------\n');
  at(2,70);put(L('ver'));
  at(3,70);put('СПТУ-132');
  at(4,70);put('01.09.88');
  at(6,12);put(L('s0m1'));
  at(7,12);put(L('s0m2'));
  at(8,12);put(L('s0m3'));
  at(10,12);put(L('s0m4'));
  at(13,18);put(L('s0prompt'));
  const a=await inputNum();
  if(a===1){await loadSeg(L('segS1'));s1();}
  else if(a===2){await loadSeg(L('segS2'));s2();}
  else if(a===4){scene=null;cls();put(L('bye')+'\n:');cursorOn=true;draw();}
  else s0();
}
async function loadSeg(title){
  scene=null;
  at(15,3);put(L('loading')+title+"'");
  await drive('lampA',900);
}

/* ══════════ S1 database block ══════════ */
async function s1(){
  scene='s1'; cls();
  put(L('s1hdr')+'\n\n');
  tab(20);put(L('worksel')+'\n');
  tab(20);put('************************\n\n');
  tab(12);put(L('s1m1')+'\n');
  tab(12);put(L('s1m2')+'\n');
  tab(12);put(L('s1m3')+'\n');
  tab(12);put(L('s1m4')+'\n');
  tab(12);put(L('s1m5')+'\n');
  tab(12);put(L('s1m6')+'\n');
  tab(12);put(L('back')+'\n\n');
  put('? ');
  const v=await inputNum();
  scene=null;
  if(v===0){await drive('lampA',600);s0();return;}
  if(v>6){put(L('badwork')+'\n');await sleep(1100);s1();return;}
  if(v===1)return s1Reserve();
  if(v===2)return s1Enter();
  if(v===3)return s1Read();
  put(L('notrestored')+'\n');
  await sleep(1400);s1();
}
async function s1Reserve(){
  cls();
  put(L('reserve')+'\n\n');
  put(L('groupsFor'));
  const n=await inputNum();
  nl();
  at(20,10);put(L('wp1')+'\n');
  at(21,10);put(L('wp2'));
  await waitContinue();
  await drive('lampA',1200);
  put('\n'+L('reserved')+(n*3)+L('sect')+'\n');
  await sleep(1300);s1();
}
async function s1Enter(){
  cls();
  put(L('writeDisk')+'\n\n');
  tab(20);put(L('enterGroup')+'\n\n');
  put(L('fmt')+'\n\n');
  put(L('end99')+'\n');
  put(L('end999')+'\n\n');
  let cur=null, count=0;
  for(;;){
    put('? ');
    const line=await waitText();
    put(line+'\n');
    const p=line.split(',').map(s=>s.trim());
    const g=parseInt(p[0],10);
    if(g===999)break;
    if(g===99){cur=null;put(L('endGrp')+'\n');continue;}
    if(isNaN(g)||p.length<4){put(L('badInput')+'\n');continue;}
    if(!cur||cur.num!==g){cur=disk.groups.find(x=>x.num===g);
      if(!cur){cur={num:g,rows:[]};disk.groups.push(cur);}}
    cur.rows.push({pn:p[1],fio:p[2].toUpperCase(),st:parseFloat(p[3])||0});
    count++;
    put(L('studentNo')+count+'\n');
  }
  at(20,20);put(L('wp3')+'\n');
  at(21,20);put(L('wp4'));
  await waitContinue();
  await drive('lampA',1500);
  await diskSave();
  put('\n'+L('written')+'\n');
  await sleep(1200);s1();
}
async function s1Read(){
  cls();
  put(L('readDisk')+'\n');
  put(L('whichGrp'));
  const g=await inputNum();
  put(L('device'));
  const dev=await inputNum();
  if(dev===1){put(L('noPrinter')+'\n');await sleep(1300);return s1Read();}
  await drive('lampA',800);
  nl();
  const gs=g===0?disk.groups:disk.groups.filter(x=>x.num===g);
  if(gs.length===0){put(L('noData')+'\n');}
  for(const grp of gs){
    put(L('group')+grp.num+'\n');
    put(L('colhdr')+'\n');
    for(const r of grp.rows){
      put('  '+String(r.pn).padEnd(4)+String(r.fio).slice(0,28).padEnd(30)+r.st.toFixed(2)+L('rub')+'\n');
    }
  }
  put('\n'+L('crCont'));
  await waitKey();s1();
}

/* ══════════ S2 user block ══════════ */
async function s2(){
  scene='s2'; cls();
  put(L('s2hdr1')+'\n'+L('s2hdr2')+'\n\n');
  tab(20);put(L('worksel')+'\n');
  tab(20);put('************************\n');
  tab(12);put(L('s2m1')+'\n');
  tab(12);put(L('s2m2')+'\n');
  tab(12);put(L('s2m3')+'\n');
  tab(12);put(L('s2res')+'-4\n');
  tab(12);put(L('s2res')+'-5\n');
  tab(12);put(L('s2res')+'-6\n');
  tab(12);put(L('s2back')+'\n\n');
  put('? ');
  const v=await inputNum();
  scene=null;
  if(v===0){await drive('lampA',600);s0();return;}
  if(v===2)return s2Enter();
  if(v===3)return s2Sheet();
  if(v>=4&&v<=6){put(L('resv')+'\n');await sleep(900);return s2();}
  if(v===1){put(L('monthDone')+'\n');await sleep(1100);return s2();}
  put(L('badwork2')+'\n');await sleep(1100);s2();
}
async function s2Enter(){
  cls();
  put(L('whichGrp0'));
  const g=await inputNum();
  const grp=disk.groups.find(x=>x.num===g)||disk.groups[0];
  if(!grp){put(L('noData2')+'\n');await sleep(1500);return s2();}
  put(L('group')+grp.num+L('students')+grp.rows.length+'\n\n');
  for(const r of grp.rows){
    put(r.pn+' '+r.fio+'\n');
    put(L('attrPrompt')+'\n');
    put(L('a4')+'\n');put(L('a5')+'\n');put(L('a6')+'\n');put(L('a7')+'\n');
    for(;;){
      put('? ');
      const k=await inputNum();
      if(k===0)break;
      if(k<4||k>7){put(L('badInput')+'\n');continue;}
      put(L('value'));
      const val=await inputNum();
      r['q'+k]=val;
    }
    nl();
  }
  await diskSave();
  put(L('entryDone')+'\n');await sleep(1100);s2();
}
async function s2Sheet(){
  cls();
  await drive('lampA',700);
  put(L('sheetHdr')+'\n');
  put('================================================================\n');
  let total=0;
  if(disk.groups.length===0)put(L('noDataSheet')+'\n');
  for(const grp of disk.groups){
    put(L('group')+grp.num+'\n');
    for(const r of grp.rows){
      const prak=(r.q6||0)*1.10, bol=(r.q7||0)*(r.st/30);
      const sum=Math.max(0,r.st+prak-bol);
      total+=sum;
      put('  '+String(r.pn).padEnd(4)+String(r.fio).slice(0,26).padEnd(28)
        +sum.toFixed(2).padStart(9)+L('rub')+'\n');
    }
  }
  put('----------------------------------------------------------------\n');
  put(L('total')+total.toFixed(2).padStart(12)+L('rub')+'\n\n');
  put(L('crBack'));
  await waitKey();s2();
}

applyChromeLang();
diskLoad().then(boot);
})();
